<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduMate</title>
<style>
:root{color-scheme:light;--bg:#f3f6ff;--card:#fff;--text:#17233b;--muted:#68758d;--line:#e1e8f5;--accent:#4f46e5;--accent-text:#fff;--ok:#0f9f83;--warn:#b45309;--bad:#be123c;--shadow:0 10px 30px rgba(35,54,100,.08);--shadow-hover:0 16px 36px rgba(50,65,130,.15)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 8% 0%,rgba(129,140,248,.2),transparent 28rem),radial-gradient(circle at 100% 12%,rgba(34,211,238,.14),transparent 25rem),var(--bg);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:15px max(20px,calc((100% - 1120px)/2));background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid rgba(225,232,245,.9);position:sticky;top:0;z-index:20}header h1{font-size:21px;letter-spacing:-.6px;margin:0;font-weight:850;color:#312e81}#userbox{display:flex;gap:10px;align-items:center;font-size:14px}#whoami{color:#475569;font-weight:650}
main{max-width:1120px;margin:0 auto;padding:28px 22px 50px}#app{position:relative}#app::before{content:"Không gian học tập của bạn";display:block;font-size:clamp(25px,3vw,34px);font-weight:850;letter-spacing:-1.1px;margin:0 0 4px;color:#18264a}#app::after{content:"Quản lý môn học, lịch học và bài tập — tất cả trong một nơi.";display:block;color:var(--muted);margin-bottom:23px;font-size:15px}
.brand-mark{display:inline-grid;place-items:center;width:31px;height:31px;border-radius:10px;margin-right:7px;color:#fff;background:linear-gradient(135deg,#818cf8,#4f46e5);font-size:18px;box-shadow:0 5px 12px rgba(79,70,229,.25)}.hero-art{position:absolute;right:10px;top:-8px;width:150px;height:92px;pointer-events:none;overflow:hidden;opacity:.9}.hero-orb{position:absolute;border-radius:50%}.orb-one{width:75px;height:75px;right:18px;top:0;background:linear-gradient(135deg,#c4b5fd,#a5f3fc)}.orb-two{width:43px;height:43px;right:77px;top:31px;background:linear-gradient(135deg,#fde68a,#fbcfe8)}.hero-emoji{position:absolute;right:35px;top:16px;font-size:37px;filter:drop-shadow(0 5px 5px rgba(49,46,129,.12))}.hero-spark{position:absolute;right:3px;top:9px;color:#f59e0b;font-size:22px}
.card{background:var(--card);border:1px solid rgba(220,228,243,.95);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}article.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover);border-color:#c7d2fe}.muted{color:var(--muted);font-size:13px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.grow{flex:1;min-width:0}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
input,select,textarea,button{font:inherit}input,select,textarea{color:var(--text);background:#f8faff;border:1px solid #d9e2f2;border-radius:10px;padding:10px 12px;min-width:0;transition:border-color .18s ease,box-shadow .18s ease,background .18s ease}input::placeholder,textarea::placeholder{color:#9aa6bb}input:focus,select:focus,textarea:focus{background:#fff;border-color:#818cf8;box-shadow:0 0 0 4px rgba(99,102,241,.12);outline:none}textarea{width:100%;resize:vertical}.row input:not([type=checkbox]){flex:1;min-width:120px}
button{background:linear-gradient(135deg,#6366f1,#4338ca);color:#fff;border:0;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:750;box-shadow:0 5px 12px rgba(79,70,229,.2);transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;white-space:nowrap}button:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 8px 18px rgba(79,70,229,.28)}button:active{transform:translateY(0) scale(.98)}button.ghost{background:#eef2ff;color:#4338ca;border:1px solid #dfe3ff;box-shadow:none}button.ghost:hover{background:#e0e7ff}button.x{background:#fff1f2;color:#be123c;padding:5px 9px;border:1px solid #ffe4e6;box-shadow:none;border-radius:8px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
nav{display:flex;gap:8px;margin:0 0 20px;padding:8px;overflow-x:auto;background:rgba(255,255,255,.82);border:1px solid #e0e7f5;border-radius:16px;box-shadow:0 6px 20px rgba(35,54,100,.05)}nav button{background:transparent;color:#65718a;border:1px solid transparent;box-shadow:none;border-radius:11px;padding:11px 17px}nav button:hover{background:#f1f3ff;color:#4338ca;box-shadow:none}nav button.active{background:linear-gradient(135deg,#6366f1,#4338ca);color:white;border-color:transparent;font-weight:800;box-shadow:0 6px 15px rgba(79,70,229,.25)}nav button[data-tab="courses"]::before{content:"▦ ";font-size:16px}nav button[data-tab="timetable"]::before{content:"▣ ";font-size:16px}nav button[data-tab="deadlines"]::before{content:"◷ ";font-size:16px}nav button[data-tab="qa"]::before{content:"✦ ";font-size:16px}
ul.list{list-style:none;margin:15px 0 0;padding:13px 15px;background:#f8faff;border-radius:12px}ul.list li{padding:5px 0}details{margin-top:15px;padding-top:12px;border-top:1px solid #e8edf7}summary{cursor:pointer;color:#4f46e5;font-weight:750;list-style:none;display:flex;align-items:center;gap:8px}summary::-webkit-details-marker{display:none}summary::before{content:"＋";display:inline-grid;place-items:center;width:23px;height:23px;border-radius:7px;background:#eef2ff;color:#4f46e5}details[open] summary::before{content:"−"}details form{margin-top:12px;padding:12px;background:#f8faff;border-radius:12px}
.week{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:12px}.day{background:linear-gradient(180deg,#fff,#f8faff);border:1px solid #e0e7f5;border-radius:15px;padding:12px;min-height:125px;box-shadow:0 5px 16px rgba(35,54,100,.04)}.day h3{font-size:13px;margin:0 0 10px;color:#4338ca;background:#eef2ff;padding:6px 8px;border-radius:8px;text-align:center}.slot{background:linear-gradient(135deg,#eef2ff,#f0f9ff);border-left:4px solid #6366f1;border-radius:9px;padding:9px;margin-bottom:8px;font-size:13px;color:#29365b}.dl{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #edf0f7}.dl:last-child{border-bottom:0}.dl input[type=checkbox]{accent-color:#4f46e5;width:18px;height:18px}.dl.done .grow{opacity:.55;text-decoration:line-through}.tag,.badge{font-size:12px;border-radius:99px;padding:4px 9px;border:1px solid #e0e7f5;background:#f8faff;color:#64748b;white-space:nowrap;font-weight:700}.badge.overdue{color:#be123c;background:#fff1f2;border-color:#fecdd3}.badge.today,.badge.soon{color:#b45309;background:#fff7ed;border-color:#fed7aa}.badge.lecturer{color:#047857;background:#ecfdf5;border-color:#a7f3d0}.ans{border-left:4px solid #a5b4fc;padding:10px 13px;margin:12px 0;background:#f8faff;border-radius:0 10px 10px 0}.pre{white-space:pre-wrap;word-break:break-word}
#auth{max-width:460px;margin:45px auto}#auth .card{padding:28px;background:linear-gradient(145deg,#fff 0%,#f7f8ff 100%);border-radius:24px}#auth .card::before{content:"🎓";display:grid;place-items:center;width:62px;height:62px;border-radius:18px;background:linear-gradient(135deg,#e0e7ff,#cffafe);font-size:30px;margin-bottom:14px}#authTitle{font-size:27px;letter-spacing:-.7px;color:#25245f}#auth form{display:grid;gap:11px}#auth form button{width:100%;padding:12px}#authSwitch{color:#4f46e5;font-weight:700;text-decoration:none}#authSwitch:hover{text-decoration:underline}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#059669;color:#fff;padding:11px 17px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;box-shadow:0 10px 30px rgba(15,23,42,.2);z-index:50}#toast.show{opacity:1}#toast.bad{background:#e11d48}#content > .muted{padding:24px;background:#fff;border:1px dashed #cbd5e1;border-radius:16px;text-align:center}#content > .muted::before{content:"✦";display:block;font-size:28px;color:#818cf8;margin-bottom:5px}[hidden]{display:none!important}
@media(max-width:640px){header{padding:12px 16px}main{padding:20px 14px 35px}.card{padding:15px;border-radius:15px}.head{align-items:flex-start;flex-direction:column}.head>button{align-self:flex-start}nav{gap:4px;padding:5px}nav button{padding:10px 12px;font-size:13px}.row{align-items:stretch}.row>button{width:100%}.row input,.row select{flex:1 1 100%}.dl{align-items:flex-start;flex-wrap:wrap}.dl .grow{flex-basis:70%}.hero-art{opacity:.35;right:0;top:0;transform:scale(.8);transform-origin:top right}#app::after{max-width:75%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header>
  <h1><span class="brand-mark" aria-hidden="true">✦</span> EduMate</h1>
  <div id="userbox" hidden><span id="whoami"></span><button class="ghost" data-click="logout">Đăng xuất</button></div>
</header>

<main>
  <section id="auth" hidden>
    <div class="card">
      <h2 id="authTitle" style="margin-top:0">Đăng nhập</h2>
      <form id="loginForm" data-submit="login">
        <input name="email" type="email" placeholder="Email" required autocomplete="username">
        <input name="password" type="password" placeholder="Mật khẩu" required autocomplete="current-password">
        <button>Đăng nhập</button>
      </form>
      <form id="registerForm" data-submit="register" hidden>
        <input name="name" placeholder="Họ và tên" required maxlength="80">
        <input name="email" type="email" placeholder="Email" required autocomplete="username">
        <input name="password" type="password" placeholder="Mật khẩu (tối thiểu 6 ký tự)" required minlength="6" autocomplete="new-password">
        <select name="role"><option value="student">Sinh viên</option><option value="lecturer">Giảng viên</option></select>
        <button>Tạo tài khoản</button>
      </form>
      <p class="muted"><a href="#" id="authSwitch">Chưa có tài khoản? Đăng ký</a></p>
    </div>
  </section>

  <section id="app" hidden>
    <div class="hero-art" aria-hidden="true"><div class="hero-orb orb-one"></div><div class="hero-orb orb-two"></div><div class="hero-emoji">📚</div><div class="hero-spark">✦</div></div>
    <nav id="tabs">
      <button data-tab="courses">Môn học</button>
      <button data-tab="timetable">Thời khóa biểu</button>
      <button data-tab="deadlines">Bài tập</button>
      <button data-tab="qa">Hỏi đáp</button>
    </nav>
    <div id="content"></div>
  </section>
</main>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];
const state = { me:null, tab:'courses', qCourse:'', open:new Set() };
const isLecturer = () => state.me.role === 'lecturer';
const fmtH = min => { const h = Math.floor(min / 60), m = min % 60; return m ? `${h}h${String(m).padStart(2, '0')}` : `${h}h`; };
const fmtRange = s => `${fmtH(s.start_min)} - ${fmtH(s.end_min)}`;
const fmtDT = s => { const [d,t] = s.split('T'); const [y,m,day] = d.split('-'); return `${day}/${m}/${y} ${t}`; };

async function api(path, method='GET', body){
  const r = await fetch('/api'+path, { method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if(!r.ok){ const e = new Error(data.error || 'Lỗi '+r.status); e.status = r.status; throw e; }
  return data;
}
/* ---------- Firebase Authentication ----------
   SDK nạp từ CDN khi cần lần đầu; cấu hình lấy từ backend (/api/config, đọc từ .env).
   Firebase chỉ dùng để xác thực: ID token được gửi cho Flask, Flask giữ phiên bằng cookie. */
const FB_CDN = 'https://www.gstatic.com/firebasejs/10.14.1/';
const FB_ERR = {
  'auth/invalid-credential':'Sai email hoặc mật khẩu', 'auth/wrong-password':'Sai email hoặc mật khẩu',
  'auth/user-not-found':'Sai email hoặc mật khẩu', 'auth/invalid-email':'Email không hợp lệ',
  'auth/email-already-in-use':'Email đã được đăng ký', 'auth/weak-password':'Mật khẩu quá yếu (tối thiểu 6 ký tự)',
  'auth/too-many-requests':'Thử quá nhiều lần, vui lòng đợi rồi thử lại', 'auth/network-request-failed':'Lỗi mạng, hãy kiểm tra kết nối',
  'auth/operation-not-allowed':'Chưa bật đăng nhập Email/Password trong Firebase Console',
  'auth/invalid-api-key':'FIREBASE_API_KEY không hợp lệ', 'auth/user-disabled':'Tài khoản đã bị vô hiệu hóa',
};
const errMsg = e => FB_ERR[e.code] || e.message || 'Đã có lỗi xảy ra';
let fbPromise = null;
function firebase(){
  if(!fbPromise) fbPromise = (async () => {
    const cfg = await api('/config');
    let appMod, authMod;
    try { [appMod, authMod] = await Promise.all([import(FB_CDN+'firebase-app.js'), import(FB_CDN+'firebase-auth.js')]); }
    catch { throw new Error('Không tải được Firebase SDK, hãy kiểm tra kết nối mạng'); }
    const auth = authMod.getAuth(appMod.initializeApp(cfg));
    await authMod.setPersistence(auth, authMod.inMemoryPersistence); // không lưu token Firebase trong trình duyệt
    return { ...authMod, auth };
  })().catch(e => { fbPromise = null; throw e; });
  return fbPromise;
}

function toast(msg, bad=true){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : '');
  clearTimeout(toast.id); toast.id = setTimeout(() => t.className = '', 3000);
}

/* ---------- Views ---------- */
async function viewCourses(){
  const { courses } = await api('/courses');
  let h = '';
  if(isLecturer()) h += `<form class="card row" data-submit="newCourse">
      <input name="code" placeholder="Mã môn (VD: CS101)" required maxlength="20">
      <input name="name" placeholder="Tên môn học" required maxlength="100">
      <button>Tạo môn học</button></form>`;
  if(isLecturer()) h += '<p style="color:var(--muted);font-size:13px;margin:0 0 14px">Bạn đang dùng tài khoản <b>Giảng viên</b>: bấm <b>Nhận phụ trách</b> ở môn bạn dạy để xem câu hỏi của sinh viên và thêm lịch học, bài tập, kỳ thi cho môn đó. Nút Đăng ký chỉ dành cho tài khoản <b>Sinh viên</b>.</p>';
  h += courses.map(courseCard).join('') || `<p class="muted">${isLecturer() ? 'Hãy tạo môn học đầu tiên ở khung phía trên.' : 'Chưa có môn học nào — giảng viên cần tạo môn học trước.'}</p>`;
  return h;
}
function courseCard(c){
  const sessions = c.sessions.map(s => `<li>${DAYS[s.weekday]} ${fmtRange(s)}${s.room ? ' · '+esc(s.room) : ''}${c.mine ? ` <button class="x" title="Xóa buổi học" data-click="delSession" data-id="${s.id}">✕</button>` : ''}</li>`).join('')
    || '<li class="muted">Chưa có lịch học</li>';
  let action = '', badge = '';
  if(!isLecturer()){
    action = c.enrolled
      ? `<button class="ghost" data-click="unenroll" data-id="${c.id}">Hủy</button>`
      : `<button data-click="enroll" data-id="${c.id}">Đăng ký</button>`;
    if(c.enrolled) badge = ' <span class="badge lecturer">✓ Đã đăng ký</span>';
  } else if(c.mine){
    badge = ' <span class="badge lecturer">✓ Đang phụ trách</span>';
    if(!c.is_owner) action = `<button class="ghost" data-click="leave" data-id="${c.id}">Thôi phụ trách</button>`;
  } else {
    action = `<button data-click="teach" data-id="${c.id}">Nhận phụ trách</button>`;
  }
  const items = (c.deadlines || []).map(d => `<li><span class="tag">${d.kind === 'exam' ? 'Kỳ thi' : 'Bài tập'}</span> ${esc(d.title)} · <span class="muted">${fmtDT(d.due_at)}</span> <button class="x" title="Xóa" data-click="delDeadline" data-id="${d.id}">✕</button></li>`).join('')
    || '<li class="muted">Chưa có bài tập hoặc kỳ thi</li>';
  const sub = 'class="muted" style="margin-top:14px;font-weight:700"';
  const manage = c.mine ? `<details data-id="${c.id}" ${state.open.has(String(c.id)) ? 'open' : ''}><summary>Quản lý: thêm lịch học, bài tập, kỳ thi</summary>
      <div ${sub}>Bài tập và kỳ thi của môn</div>
      <ul class="list" style="margin-top:6px">${items}</ul>
      <div ${sub}>Thêm buổi học</div>
      <form class="row" data-submit="addSession" data-id="${c.id}">
        <select name="weekday">${DAYS.map((d,i) => `<option value="${i}">${d}</option>`).join('')}</select>
        <input type="time" name="start" required> <input type="time" name="end" required>
        <input name="room" placeholder="Phòng" maxlength="30"><button>Thêm buổi học</button></form>
      <div ${sub}>Thêm bài tập hoặc kỳ thi</div>
      <form class="row" data-submit="addDeadline" data-id="${c.id}">
        <input name="title" placeholder="Tên bài tập / kỳ thi" required maxlength="120">
        <select name="kind"><option value="assignment">Bài tập</option><option value="exam">Kỳ thi</option></select>
        <input type="datetime-local" name="due_at" required><button>Thêm</button></form>
    </details>` : '';
  return `<article class="card"><div class="head"><div><strong>${esc(c.code)}</strong> — ${esc(c.name)}${badge}
      <div class="muted">GV: ${esc(c.lecturer_name)} · ${c.student_count} sinh viên</div></div>${action}</div>
      <ul class="list">${sessions}</ul>${manage}</article>`;
}

async function viewTimetable(){
  const { days } = await api('/timetable');
  if(days.every(d => !d.length)) return `<p class="muted">${isLecturer() ? 'Hãy thêm buổi học cho môn của bạn ở tab Môn học.' : 'Bạn chưa đăng ký môn nào. Đăng ký ở tab Môn học để tự động tạo thời khóa biểu.'}</p>`;
  return `<div class="week">${days.map((items,i) => `<div class="day"><h3>${DAYS[i]}</h3>${
    items.map(s => `<div class="slot"><b>${fmtRange(s)}</b><br>${esc(s.course_code)} ${esc(s.course_name)}${s.room ? `<br><span class="muted">${esc(s.room)}</span>` : ''}</div>`).join('')
    || '<span class="muted">—</span>'}</div>`).join('')}</div>`;
}

async function viewDeadlines(){
  const { deadlines } = await api('/deadlines');
  if(!deadlines.length) return '<p class="muted">Chưa có bài tập nào.' + (isLecturer() ? ' Thêm bài tập trong mục “Quản lý” của từng môn ở tab Môn học.' : ' Hãy đăng ký môn học ở tab Môn học để xem bài tập của môn đó.') + '</p>';
  const label = d => d.status === 'overdue' ? 'Quá hạn' : d.status === 'today' ? 'Hôm nay' : `Còn ${d.days_left} ngày`;
  return `<div class="card">${deadlines.map(d => `<div class="dl ${d.done ? 'done' : ''}">
      ${isLecturer() ? '' : `<input type="checkbox" data-change="toggleDone" data-id="${d.id}" ${d.done ? 'checked' : ''} aria-label="Đã hoàn thành">`}
      <div class="grow"><strong>${esc(d.title)}</strong> <span class="tag">${d.kind === 'exam' ? 'Kỳ thi' : 'Bài tập'}</span>
        <div class="muted">${esc(d.course_code)} · ${fmtDT(d.due_at)}</div></div>
      ${d.done ? '' : `<span class="badge ${d.status}">${label(d)}</span>`}
      ${isLecturer() ? `<button class="x" title="Xóa" data-click="delDeadline" data-id="${d.id}">✕</button>` : ''}
    </div>`).join('')}</div>`;
}

async function viewQA(){
  const { courses } = await api('/courses');
  const mine = courses.filter(c => isLecturer() ? c.mine : c.enrolled);
  if(!mine.length) return isLecturer()
    ? `<p class="muted">Bạn chưa phụ trách môn nào nên chưa có câu hỏi để trả lời.<br>Vào tab <b>Môn học</b> và bấm <b>Nhận phụ trách</b> ở môn bạn dạy.<br><button data-tab="courses" style="margin-top:14px">Đến tab Môn học</button></p>`
    : `<p class="muted">Hãy đăng ký môn học để đặt câu hỏi cho giảng viên.</p>`;
  if(!mine.some(c => String(c.id) === state.qCourse)) state.qCourse = '';
  const { questions } = await api('/questions' + (state.qCourse ? `?course_id=${state.qCourse}` : ''));
  const opts = mine.map(c => `<option value="${c.id}" ${String(c.id) === state.qCourse ? 'selected' : ''}>${esc(c.code)} — ${esc(c.name)}</option>`).join('');
  const pending = questions.filter(q => !q.answers.length).length;
  if(isLecturer()) questions.sort((a, b) => (a.answers.length > 0) - (b.answers.length > 0)); // chưa trả lời lên trước
  const who = (name, role) => `${esc(name)} ${role === 'lecturer' ? '<span class="badge lecturer">Giảng viên</span>' : ''}`;
  let h = `<div class="row" style="margin-bottom:12px"><label class="muted">Lọc theo môn:</label>
      <select data-change="qFilter"><option value="">Tất cả</option>${opts}</select>${isLecturer() ? ` <span class="badge ${pending ? 'soon' : ''}">${pending ? pending + ' câu hỏi chưa trả lời' : 'Đã trả lời hết'}</span>` : ''}</div>`;
  if(!isLecturer()) h += `<form class="card" data-submit="ask" style="display:grid;gap:8px">
      <strong>Đặt câu hỏi</strong>
      <select name="course_id">${opts}</select>
      <input name="title" placeholder="Tiêu đề" required maxlength="150">
      <textarea name="body" rows="3" placeholder="Nội dung câu hỏi" required maxlength="2000"></textarea>
      <div><button>Gửi câu hỏi</button></div></form>`;
  h += questions.map(q => `<article class="card"><strong>${esc(q.title)}</strong>${q.answers.length ? '' : ' <span class="badge soon">Chưa trả lời</span>'}
      <div class="muted">${esc(q.course_code)} · ${who(q.author_name, q.author_role)} · ${fmtDT(q.created_at)}</div>
      <p class="pre">${esc(q.body)}</p>
      ${q.answers.map(a => `<div class="ans"><div class="muted">${who(a.author_name, a.author_role)} · ${fmtDT(a.created_at)}</div><div class="pre">${esc(a.body)}</div></div>`).join('')}
      <form class="row" data-submit="reply" data-id="${q.id}"><input name="body" placeholder="Viết trả lời…" required maxlength="2000"><button>Gửi</button></form>
    </article>`).join('') || `<p class="muted">${isLecturer() ? 'Chưa có câu hỏi nào từ sinh viên trong các môn bạn phụ trách.' : 'Chưa có câu hỏi nào.'}</p>`;
  return h;
}

const views = { courses:viewCourses, timetable:viewTimetable, deadlines:viewDeadlines, qa:viewQA };

async function render(){
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  try { $('#content').innerHTML = await views[state.tab](); }
  catch(e){ if(e.status === 401) setUser(null); else toast(e.message); }
}

/* ---------- Actions ---------- */
const done = (msg, then = render) => { toast(msg, false); return then(); };
const actions = {
  async login(d){
    const fb = await firebase();
    const cred = await fb.signInWithEmailAndPassword(fb.auth, d.email, d.password);
    setUser((await api('/login','POST',{ id_token: await cred.user.getIdToken() })).user);
  },
  async register(d){
    const fb = await firebase();
    const cred = await fb.createUserWithEmailAndPassword(fb.auth, d.email, d.password);
    await fb.updateProfile(cred.user, { displayName: d.name });
    const id_token = await cred.user.getIdToken();
    setUser((await api('/register','POST',{ id_token, name:d.name, role:d.role })).user);
  },
  async logout(){
    await api('/logout','POST');
    if(fbPromise){ try { const fb = await fbPromise; await fb.signOut(fb.auth); } catch {} }
    setUser(null);
  },
  async newCourse(d){ await api('/courses','POST',d); await done('Đã tạo môn học'); },
  async addSession(d,id){ state.open.add(id); await api(`/courses/${id}/sessions`,'POST',d); await done('Đã thêm buổi học'); },
  async delSession(_,id){ await api(`/sessions/${id}`,'DELETE'); await done('Đã xóa buổi học'); },
  async addDeadline(d,id){ state.open.add(id); await api(`/courses/${id}/deadlines`,'POST',d); await done('Đã thêm bài tập'); },
  async delDeadline(_,id){ await api(`/deadlines/${id}`,'DELETE'); await done('Đã xóa bài tập'); },
  async teach(_,id){ await api(`/courses/${id}/teach`,'POST'); await done('Bạn đã nhận phụ trách môn này — câu hỏi của sinh viên sẽ hiện ở tab Hỏi đáp'); },
  async leave(_,id){ await api(`/courses/${id}/teach`,'DELETE'); await done('Đã thôi phụ trách môn này'); },
  async enroll(_,id){ await api(`/courses/${id}/enroll`,'POST'); await done('Đăng ký thành công — bài tập của môn đã hiện ở tab Bài tập'); },
  async unenroll(_,id){ await api(`/courses/${id}/enroll`,'DELETE'); await done('Đã hủy đăng ký'); },
  async toggleDone(d,id){ await api(`/deadlines/${id}/done`,'POST',d); await render(); },
  async ask(d){ await api(`/courses/${d.course_id}/questions`,'POST',{title:d.title, body:d.body}); await done('Đã gửi câu hỏi'); },
  async reply(d,id){ await api(`/questions/${id}/answers`,'POST',d); await render(); },
  async qFilter(d){ state.qCourse = d.value; await render(); },
};
async function run(name, data, id){
  try { await actions[name](data, id); } catch(e){ toast(errMsg(e)); if(state.me) render(); }
}
document.addEventListener('submit', e => {
  const f = e.target.closest('form[data-submit]'); if(!f) return;
  e.preventDefault(); run(f.dataset.submit, Object.fromEntries(new FormData(f)), f.dataset.id);
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if(t){ state.tab = t.dataset.tab; return render(); }
  const b = e.target.closest('[data-click]'); if(b) run(b.dataset.click, {}, b.dataset.id);
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-change]'); if(!el) return;
  run(el.dataset.change, el.type === 'checkbox' ? { done: el.checked } : { value: el.value }, el.dataset.id);
});
document.addEventListener('toggle', e => {
  const d = e.target; if(!d.matches || !d.matches('details[data-id]')) return;
  d.open ? state.open.add(d.dataset.id) : state.open.delete(d.dataset.id);
}, true);

/* ---------- Auth UI ---------- */
let registering = false;
$('#authSwitch').addEventListener('click', e => {
  e.preventDefault(); registering = !registering;
  $('#loginForm').hidden = registering; $('#registerForm').hidden = !registering;
  $('#authTitle').textContent = registering ? 'Đăng ký' : 'Đăng nhập';
  e.target.textContent = registering ? 'Đã có tài khoản? Đăng nhập' : 'Chưa có tài khoản? Đăng ký';
});
function setUser(u){
  state.me = u; state.tab = 'courses'; state.qCourse = ''; state.open.clear();
  $('#auth').hidden = !!u; $('#app').hidden = !u; $('#userbox').hidden = !u;
  if(u){ $('#whoami').textContent = `${u.name} · ${u.role === 'student' ? 'Sinh viên' : 'Giảng viên'}`; render(); }
}
api('/me').then(r => setUser(r.user)).catch(() => setUser(null));
</script>
